name: Build Desktop (Windows)

# 桌面端（Tauri）构建：只在「要发布」时才构建，日常 push 到 main 不触发：
#   1) 推 v* 标签  ->  例如 git tag v1.2.3 && git push origin v1.2.3
#   2) Actions 页面手动触发（Run workflow）
#
# 说明：本仓库为 monorepo。
#   - 桌面端位于 apps/desktop（Tauri 外壳），打包 apps/web 的静态产物
#   - Web 端位于 apps/web，部署到 Cloudflare Pages，无需本工作流
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop app
        working-directory: apps/desktop
        # beforeBuildCommand 会先执行 apps/web 的静态导出构建
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AlchemyWorkshop-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
