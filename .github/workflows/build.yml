name: Build Windows Release (Desktop)

# 桌面端（Godot）构建：只在「要发布」时才构建，日常 push 到 main 不触发：
#   1) 推 v* 标签  ->  例如 git tag v1.2.3 && git push origin v1.2.3
#   2) Actions 页面手动触发（Run workflow）
#
# 说明：本仓库为 monorepo，Godot 工程位于 apps/desktop/。
#       Web 端（apps/web）请另配工作流或部署平台，标签约定可用 web-v*。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DESKTOP_DIR: apps/desktop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          PROJECT_VER="$(sed -n 's/^config\/version="\([^"]*\)"$/\1/p' "${DESKTOP_DIR}/project.godot" | head -n1)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            REF_VER="${GITHUB_REF_NAME#v}"
            if [ "${REF_VER}" != "${PROJECT_VER}" ]; then
              echo "::warning title=版本不一致::标签 ${GITHUB_REF_NAME} 与 project.godot 的 ${PROJECT_VER} 不一致，产物按标签版本命名。"
            fi
            VER="${REF_VER}"
          else
            VER="${PROJECT_VER}"
          fi
          if [ -z "${VER}" ]; then
            echo "::error::无法确定版本号（project.godot 缺少 config/version）"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "构建版本：v${VER}"

      - name: Setup Godot 4.7.2 and export templates
        run: |
          curl -L --fail -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -L --fail -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q godot.zip
          unzip -q templates.tpz -d tpz_tmp
          mkdir -p ~/.local/share/godot/export_templates
          mv tpz_tmp/templates ~/.local/share/godot/export_templates/4.7.2.stable
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Export release build
        run: |
          mkdir -p "${DESKTOP_DIR}/builds"
          APP="AlchemyWorkshop_v${{ steps.version.outputs.version }}.exe"
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path "${DESKTOP_DIR}" --import > /dev/null 2>&1 || true
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path "${DESKTOP_DIR}" --export-release "Windows Desktop" "${DESKTOP_DIR}/builds/${APP}"
          ls -la "${DESKTOP_DIR}/builds/"

      - name: Checksum
        run: |
          cd "${DESKTOP_DIR}/builds"
          APP="AlchemyWorkshop_v${{ steps.version.outputs.version }}.exe"
          sha256sum "${APP}" | tee "${APP}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlchemyWorkshop_v${{ steps.version.outputs.version }}_win64
          path: |
            apps/desktop/builds/AlchemyWorkshop_v${{ steps.version.outputs.version }}.exe
            apps/desktop/builds/AlchemyWorkshop_v${{ steps.version.outputs.version }}.exe.sha256
          if-no-files-found: error
